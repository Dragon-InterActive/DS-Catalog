# Katalog-Quelle: welche Programme aus welchem Repository kommen.
# Catalog source: which programs come from which repository.
# Schema: crates/ds-sign/src/catalog_build.rs

[[program]]
id = "freya-tde"
name = "Freya TDE"
description = "Visuelle Entwicklungsumgebung für Rust im Delphi/Lazarus-Stil"
homepage = "https://github.com/Freya-TDE/Freya-TDE"
license = "MIT OR Apache-2.0"
repository = "Freya-TDE/Freya-TDE"
formula = "freya-tde/tap/freya-tde"
# Formel mit fertigem arm64-Programm / formula with a prebuilt arm64 program
brew-platforms = ["macos-aarch64"]
# Freya TDE bringt den CT-Editor mit, wenn er fehlt (nicht umgekehrt; DS-Launcher ≥ 0.2.0).
# Freya TDE installs the CT-Editor along if missing (not the other way round).
requires = ["ct-editor"]

[[program]]
id = "ct-editor"
name = "CT-Editor"
description = "Visueller Editor für Cargo.toml-Dateien"
homepage = "https://github.com/Freya-TDE/CT-E"
license = "MIT OR Apache-2.0"
repository = "Freya-TDE/CT-E"
formula = "freya-tde/tap/ct-editor"

[[program]]
id = "ds-launcher"
name = "DS-Launcher"
description = "Installiert und aktualisiert die Programme von Dragon Software"
homepage = "https://catalog.dragon-software.net"
license = "MIT OR Apache-2.0"
repository = "Dragon-InterActive/DS-Catalog"
tag-prefix = "ds-launcher-v"
formula = "freya-tde/tap/ds-launcher"
brew-platforms = ["macos-aarch64"]
